name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: win-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: win-

      - uses: dtolnay/rust-toolchain@stable

      - name: Add MSVC to PATH
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Perl and Make
        run: choco install strawberryperl make --no-progress

      - uses: oven-sh/setup-bun@v2

      - run: bun i --frozen-lockfile

      - name: Build
        run: bunx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  linux:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: linux-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: linux-

      - uses: dtolnay/rust-toolchain@stable

      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev libsecret-1-dev libudev-dev build-essential pkg-config perl make

      - uses: oven-sh/setup-bun@v2

      - run: bun i --frozen-lockfile

      - name: Build
        run: bunx tauri build --bundles deb,appimage

      - uses: actions/upload-artifact@v4
        with:
          name: linux-installer
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
