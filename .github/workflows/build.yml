name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        if: github.event_name != 'release'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: win-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: win-

      - uses: dtolnay/rust-toolchain@stable

      - name: Add MSVC to PATH
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Perl and Make
        run: choco install strawberryperl make --no-progress

      - uses: oven-sh/setup-bun@v2

      - run: bun i --frozen-lockfile

      - name: Build
        run: bunx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      - name: Prepare release files
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          $exes = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe)
          if ($exes.Count -ne 1) { throw "Expected exactly one NSIS installer, found $($exes.Count)" }
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item $exes[0].FullName release/spanani-installer-setup.exe
          $hash = (Get-FileHash release/spanani-installer-setup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText("$PWD/release/SHA256SUMS.txt", "$hash  spanani-installer-setup.exe`n")
          Get-Content release/SHA256SUMS.txt

      - uses: actions/attest-build-provenance@v2
        if: github.event_name == 'release'
        with:
          subject-path: release/spanani-installer-setup.exe

      - name: Attach files to the release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload $env:TAG release/spanani-installer-setup.exe release/SHA256SUMS.txt --clobber --repo $env:GITHUB_REPOSITORY
